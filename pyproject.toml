
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optimization-lab"
version = "0.1.0"
description = "A research and engineering project for multi-objective optimization."
requires-python = ">=3.10"

# 当前核心版本没有第三方运行时依赖
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
